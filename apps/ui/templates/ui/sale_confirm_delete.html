{% extends "ui/base.html" %}
{% block title %}Șterge vânzare{% endblock %}

{% block content %}
<h2>Șterge vânzare</h2>

<div class="alert alert-warning">
  Ești sigur că vrei să ștergi vânzarea <strong>#{{ sale.id }}</strong>
  ({{ sale.doc_no|default:"fără număr" }}, {{ sale.date }})?
  Această acțiune este ireversibilă.
</div>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Da, șterge</button>
  <a class="btn btn-outline-secondary" href="{% url 'ui:sales_list' %}">Renunță</a>
</form>
{% endblock %}
