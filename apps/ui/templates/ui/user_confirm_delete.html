{% extends "ui/base.html" %}
{% block title %}Șterge utilizator{% endblock %}

{% block content %}
<h2 class="mb-3">Șterge utilizator</h2>

<div class="alert alert-warning">
  Ești sigur că vrei să ștergi contul <strong>{{ user_obj.username }}</strong>?
</div>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Da, șterge</button>
  <a class="btn btn-outline-secondary" href="{% url 'ui:users_list' %}">Anulează</a>
</form>
{% endblock %}
